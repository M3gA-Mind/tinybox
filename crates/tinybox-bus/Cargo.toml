[package]
name = "tinybox-bus"
description = "Serializable TinyBox module contract without a runtime or backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The bus boundary contains data only; serialization is its sole dependency.
serde.workspace = true
# Only the `storage` feature: the schema the host composes. Ports only (no
# backend, no I/O), pure JSON steps.
serde_json = { workspace = true, optional = true }
tinystoragedrivers-core = { workspace = true, optional = true }

[features]
default = []
# `storage_schema()` and its pure v1 to v2 steps. Off by default so the
# contract's default dependency closure stays serde only; a host enables it.
storage = ["dep:serde_json", "dep:tinystoragedrivers-core"]

[dev-dependencies]
serde_json.workspace = true
# Migration tests run the steps over `MemoryStorage`.
tokio = { workspace = true }

[lints]
workspace = true
