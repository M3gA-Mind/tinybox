[package]
name = "tinybox-bus"
description = "Serializable TinyBox module contract without a runtime or backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The bus boundary contains data only; serialization is its sole dependency.
serde.workspace = true
serde_json.workspace = true
# Ports only (no backend, no I/O); the `Schema` type the host composes.
tinystoragedrivers-core.workspace = true

[dev-dependencies]
# Migration tests run the steps over `MemoryStorage`.
tokio = { workspace = true }

[lints]
workspace = true
